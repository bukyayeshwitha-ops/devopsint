<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Sign in | DevOpsInt</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; }
    button, input { font: inherit; }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(360px, 1fr);
    }

    .welcome {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(32px, 6vw, 80px);
      color: #fff;
      background:
        radial-gradient(ellipse at 18% 82%, rgb(31 125 255 / 28%), transparent 36%),
        linear-gradient(145deg, #101827 0%, #172d4b 58%, #124a70 100%);
    }

    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 1.1rem; font-weight: 750; letter-spacing: .01em; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid rgb(255 255 255 / 24%); border-radius: 12px; background: rgb(255 255 255 / 10%); color: #8bd5ff; font-size: 1.2rem; }
    .welcome-copy { max-width: 520px; padding: 48px 0; }
    .eyebrow { margin: 0 0 16px; color: #9edbff; font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.5rem, 5vw, 4.5rem); line-height: 1.06; letter-spacing: -.055em; }
    .welcome-copy p:last-child { max-width: 430px; margin: 22px 0 0; color: #c4d2e3; font-size: 1.05rem; line-height: 1.7; }
    .welcome-footer { color: #aebdd0; font-size: .85rem; }

    .form-side { display: grid; place-items: center; padding: 40px 24px; background: #fff; }
    .card { width: min(100%, 420px); }
    .card h2 { margin: 0; font-size: 2rem; letter-spacing: -.04em; }
    .intro { margin: 10px 0 32px; color: #68758a; line-height: 1.6; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 650; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; min-height: 50px; padding: 0 14px; border: 1px solid #d5dce7; border-radius: 9px; outline: none; background: #fff; color: #172033; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #3478f6; box-shadow: 0 0 0 3px rgb(52 120 246 / 15%); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 72px; }
    .toggle-password { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); border: 0; padding: 6px; background: transparent; color: #52627a; cursor: pointer; font-size: .82rem; font-weight: 650; }
    .options { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 24px; font-size: .88rem; }
    .remember { display: inline-flex; align-items: center; gap: 8px; color: #526075; }
    .remember input { width: 16px; height: 16px; accent-color: #2868e8; }
    a { color: #245fd1; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .submit { width: 100%; min-height: 50px; border: 0; border-radius: 9px; background: #2868e8; color: white; cursor: pointer; font-weight: 700; box-shadow: 0 5px 12px rgb(40 104 232 / 18%); }
    .submit:hover { background: #1e57ca; }
    .submit:focus-visible, .toggle-password:focus-visible, a:focus-visible { outline: 3px solid #8bb5ff; outline-offset: 3px; }
    .signup { margin: 26px 0 0; color: #68758a; text-align: center; font-size: .9rem; }
    .signup a { margin-left: 4px; }
    .notice { min-height: 1.4em; margin: 14px 0 0; color: #a33b2d; font-size: .88rem; }

    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; }
      .welcome { min-height: 260px; padding: 28px 24px; }
      .welcome-copy { padding: 42px 0 24px; }
      .welcome-copy h1 { font-size: clamp(2.3rem, 10vw, 3.4rem); }
      .welcome-copy p:last-child { margin-top: 14px; font-size: .95rem; }
      .welcome-footer { display: none; }
      .form-side { padding: 44px 24px 56px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="welcome" aria-label="Welcome">
      <div class="brand"><span class="brand-mark" aria-hidden="true">⌘</span> DevOpsInt</div>
      <div class="welcome-copy">
        <p class="eyebrow">Build. Ship. Improve.</p>
        <h1>Your work,<br>in sync.</h1>
        <p>Sign in to continue to your workspace and keep your team moving forward.</p>
      </div>
      <div class="welcome-footer">© <span id="year"></span> DevOpsInt</div>
    </section>

    <section class="form-side" aria-labelledby="signin-title">
      <div class="card">
        <h2 id="signin-title">Welcome back</h2>
        <p class="intro">Enter your account details to sign in.</p>
        <form id="login-form" action="#" method="post">
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button class="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>
          <div class="options">
            <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
            <a href="mailto:support@example.com?subject=Password%20reset">Forgot password?</a>
          </div>
          <button class="submit" type="submit">Sign in</button>
          <p class="notice" id="form-notice" role="status" aria-live="polite"></p>
        </form>
        <p class="signup">New to DevOpsInt? <a href="mailto:support@example.com?subject=Create%20an%20account">Create an account</a></p>
      </div>
    </section>
  </main>
  <script>
    const password = document.querySelector('#password');
    const toggle = document.querySelector('.toggle-password');
    const form = document.querySelector('#login-form');

    document.querySelector('#year').textContent = new Date().getFullYear();
    toggle.addEventListener('click', () => {
      const showing = password.type === 'password';
      password.type = showing ? 'text' : 'password';
      toggle.textContent = showing ? 'Hide' : 'Show';
      toggle.setAttribute('aria-pressed', String(showing));
    });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#form-notice').textContent = 'Connect this form to your authentication service to enable sign-in.';
    });
  </script>
</body>
</html>
