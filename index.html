<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Create account | DevOpsInt</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; }
    button, input { font: inherit; }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(360px, 1fr);
    }

    .welcome {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(32px, 6vw, 80px);
      color: #fff;
      background:
        radial-gradient(ellipse at 18% 82%, rgb(31 125 255 / 28%), transparent 36%),
        linear-gradient(145deg, #101827 0%, #172d4b 58%, #124a70 100%);
    }

    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 1.1rem; font-weight: 750; letter-spacing: .01em; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid rgb(255 255 255 / 24%); border-radius: 12px; background: rgb(255 255 255 / 10%); color: #8bd5ff; font-size: 1.3rem; }
    .welcome-copy { max-width: 520px; padding: 48px 0; }
    .eyebrow { margin: 0 0 16px; color: #9edbff; font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.5rem, 5vw, 4.5rem); line-height: 1.06; letter-spacing: -.055em; }
    .welcome-copy p:last-child { max-width: 430px; margin: 22px 0 0; color: #c4d2e3; font-size: 1.05rem; line-height: 1.7; }
    .welcome-footer { color: #aebdd0; font-size: .85rem; }

    .form-side { display: grid; place-items: center; padding: 40px 24px; background: #fff; }
    .card { width: min(100%, 440px); }
    .card h2 { margin: 0; font-size: 2rem; letter-spacing: -.04em; }
    .intro { margin: 10px 0 28px; color: #68758a; line-height: 1.6; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 650; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; min-height: 50px; padding: 0 14px; border: 1px solid #d5dce7; border-radius: 9px; outline: none; background: #fff; color: #172033; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #3478f6; box-shadow: 0 0 0 3px rgb(52 120 246 / 15%); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 72px; }
    .toggle-password { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); border: 0; padding: 6px; background: transparent; color: #52627a; cursor: pointer; font-size: .82rem; font-weight: 650; }
    .terms { display: flex; align-items: flex-start; gap: 9px; margin: 4px 0 22px; color: #526075; font-size: .88rem; line-height: 1.5; }
    .terms input { width: 16px; height: 16px; flex: 0 0 auto; margin: 2px 0 0; accent-color: #2868e8; }
    a { color: #245fd1; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .submit { width: 100%; min-height: 50px; border: 0; border-radius: 9px; background: #2868e8; color: white; cursor: pointer; font-weight: 700; box-shadow: 0 5px 12px rgb(40 104 232 / 18%); }
    .submit:hover { background: #1e57ca; }
    .submit:focus-visible, .toggle-password:focus-visible, a:focus-visible { outline: 3px solid #8bb5ff; outline-offset: 3px; }
    .signin { margin: 24px 0 0; color: #68758a; text-align: center; font-size: .9rem; }
    .signin a { margin-left: 4px; }
    .notice { min-height: 1.4em; margin: 14px 0 0; color: #245fd1; font-size: .88rem; }

    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; }
      .welcome { min-height: 240px; padding: 28px 24px; }
      .welcome-copy { padding: 36px 0 20px; }
      .welcome-copy h1 { font-size: clamp(2.3rem, 10vw, 3.4rem); }
      .welcome-copy p:last-child { margin-top: 14px; font-size: .95rem; }
      .welcome-footer { display: none; }
      .form-side { padding: 40px 24px 52px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="welcome" aria-label="Welcome">
      <div class="brand"><span class="brand-mark" aria-hidden="true">⌘</span> DevOpsInt</div>
      <div class="welcome-copy">
        <p class="eyebrow">Build. Ship. Improve.</p>
        <h1>Make great<br>work happen.</h1>
        <p>Create your account to bring your projects and team together in one workspace.</p>
      </div>
      <div class="welcome-footer">© <span id="year"></span> DevOpsInt</div>
    </section>

    <section class="form-side" aria-labelledby="register-title">
      <div class="card">
        <h2 id="register-title">Create your account</h2>
        <p class="intro">Get started with DevOpsInt. It only takes a minute.</p>
        <form id="registration-form" action="#" method="post">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Alex Morgan" required>
          </div>
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
              <button class="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter your password again" required>
          </div>
          <label class="terms">
            <input name="terms" type="checkbox" required>
            <span>I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</span>
          </label>
          <button class="submit" type="submit">Create account</button>
          <p class="notice" id="form-notice" role="status" aria-live="polite"></p>
        </form>
        <p class="signin">Already have an account? <a href="index.html">Sign in</a></p>
      </div>
    </section>
  </main>
  <script>
    const password = document.querySelector('#password');
    const confirmPassword = document.querySelector('#confirm-password');
    const toggle = document.querySelector('.toggle-password');
    const form = document.querySelector('#registration-form');

    document.querySelector('#year').textContent = new Date().getFullYear();

    toggle.addEventListener('click', () => {
      const showing = password.type === 'password';
      password.type = showing ? 'text' : 'password';
      confirmPassword.type = showing ? 'text' : 'password';
      toggle.textContent = showing ? 'Hide' : 'Show';
      toggle.setAttribute('aria-pressed', String(showing));
    });

    confirmPassword.addEventListener('input', () => {
      confirmPassword.setCustomValidity(
        confirmPassword.value && confirmPassword.value !== password.value
          ? 'Passwords do not match.'
          : ''
      );
    });
    password.addEventListener('input', () => confirmPassword.dispatchEvent(new Event('input')));

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#form-notice').textContent = 'The form is ready. Connect it to your registration service to create accounts.';
    });
  </script>
</body>
</html>
